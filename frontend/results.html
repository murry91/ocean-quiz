<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Your Results: OCEAN Digital Footprint</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Quicksand:wght@500;600;700&family=Schibsted+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="page">
    <div class="quiz-card" style="max-width: 640px;">
      <p class="brand">Your Results</p>

      <div id="resultsContent" style="margin-top: 24px;">
        <p style="color: var(--text-soft);">Loading your results…</p>
      </div>

      <div class="chart-wrap">
        <canvas id="radarChart"></canvas>
      </div>

      <div id="traitBreakdown" style="margin-top: 8px;"></div>

      <div class="actions">
        <button class="btn btn-ghost" id="downloadBtn">Download result card</button>
        <button class="btn btn-primary" onclick="window.location.href='quiz.html'">Retake quiz</button>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="traitContent.js"></script>
  <script src="results.js"></script>
</body>
</html>
